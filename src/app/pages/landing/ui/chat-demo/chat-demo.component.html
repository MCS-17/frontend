<div class="w-full">
  <div class="mb-6 w-full max-w-5xl mx-auto">
    <div class="mode-switch flex w-full rounded-lg p-1">
      <button
        type="button"
        class="flex-1 px-4 py-2 rounded-md text-sm font-semibold"
        [class.bg-white]="mode() === 'manual'"
        [class.shadow]="mode() === 'manual'"
        (click)="setMode('manual')"
      >
        Manual
      </button>
      <button
        type="button"
        class="flex-1 px-4 py-2 rounded-md text-sm font-semibold"
        [class.bg-white]="mode() === 'vibes'"
        [class.shadow]="mode() === 'vibes'"
        (click)="setMode('vibes')"
      >
        Just vibes
      </button>
    </div>
  </div>

  <div class="mt-6 w-full max-w-5xl mx-auto flex items-start justify-center">
    @if (mode() === 'manual') {
      <app-code-sample-card />
    } @else {
      <div class="w-full min-h-102 flex flex-col justify-center">
        <div class="text-center font-normal text-4xl sm:text-5xl">Welcome Back!</div>

        <div class="mt-6 bg-white border-2 border-neutral-500 rounded-xl flex items-center justify-between gap-4 px-5 py-4">
          <div class="text-base sm:text-lg text-black truncate">
            {{ placeholder() }}
          </div>

          <button
            type="button"
            class="shrink-0 size-10 rounded-full bg-neutral-400 flex items-center justify-center"
            aria-label="Send"
          >
            <img
              ngSrc="/assets/landing/arrow-up-right.svg"
              width="20"
              height="20"
              alt=""
              class="size-5"
            />
          </button>
        </div>
      </div>
    }
  </div>
</div>
