<section class="pt-9 pb-10 w-full">
  <div class="flex items-center justify-center text-lg sm:text-xl opacity-60">
    Trusted by students taking
  </div>

  <div class="mt-6 w-full border-t border-black/20"></div>

  <div class="mt-6 w-full grid grid-cols-2 sm:grid-cols-4 gap-6 sm:gap-10 text-center text-lg sm:text-xl opacity-60">
    @for (item of items; track item.code) {
      <div class="leading-normal">
        <div>{{ item.code }}</div>
        <div>{{ item.label }}</div>
      </div>
    }
  </div>
</section>
